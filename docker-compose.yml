services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bazra-postgres
    environment:
      POSTGRES_USER: bazra
      POSTGRES_PASSWORD: bazra
      POSTGRES_DB: bazra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazra -d bazra"]
      interval: 5s
      timeout: 5s
      retries: 5

