services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bazra-postgres
    environment:
      POSTGRES_USER: bazra
      POSTGRES_PASSWORD: bazra
      POSTGRES_DB: bazra
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazra -d bazra"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bazra-backend
    env_file: .env
    environment:
      # Overrides .env's host-oriented DATABASE_URL (localhost:5434, for running
      # the backend outside Docker) with the in-network address: other containers
      # reach Postgres via the Compose service name and its internal port.
      DATABASE_URL: postgresql+psycopg://bazra:bazra@postgres:5432/bazra
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app

  # frontend:
  #   Added in Checkpoint 4 once frontend/Dockerfile and the Vite skeleton exist.
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules
  #   depends_on:
  #     - backend

volumes:
  pgdata:
